name = "ravens-playbook"
main = "src/index.js"
compatibility_date = "2025-09-01"
# marlbororavens.com (and www) run on this Worker; the workers.dev address keeps working too
routes = [
  { pattern = "marlbororavens.com/*", zone_name = "marlbororavens.com" },
  { pattern = "www.marlbororavens.com/*", zone_name = "marlbororavens.com" }
]
workers_dev = true

# before every deploy (here or in Cloudflare's GitHub builds): copy the page and the backup playbook next to the Worker
[build]
command = "mkdir -p public && cp ../index.html ../playbook.json public/"

# the website itself (index.html and the backup playbook.json); /playbook and /save go to the code in src/
[assets]
directory = "./public"
binding = "ASSETS"
# the code below runs first, so http:// and www. can be sent to https://marlbororavens.com
run_worker_first = true

[vars]
# where the playbook comes from before the first coach save
SEED_URL = "https://marlbororavens.com/playbook.json"

[[d1_databases]]
binding = "DB"
database_name = "ravens-playbook"
database_id = "b39b18d7-1520-467c-9bec-dabf6dfb4f14"
